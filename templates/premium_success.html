<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <title>お支払い完了 | るみろぐ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Hiragino Sans", "Yu Gothic", "Kosugi Maru", sans-serif;
            margin: 0;
            padding: 40px 16px;
            background: linear-gradient(180deg, #fffafd 0%, #fff6f8 100%);
            color: #555;
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: rgba(255,248,252,0.98);
            border: 1px solid #f1d5dd;
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 8px 32px rgba(199,91,122,0.12);
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 {
            font-family: "Kosugi Maru", sans-serif;
            color: #c75b7a;
            font-size: 22px;
            margin: 0 0 12px;
        }
        .lead {
            font-size: 14px;
            color: #8a7a80;
            line-height: 1.8;
            margin-bottom: 24px;
        }
        .steps {
            background: rgba(255,230,238,0.4);
            border: 1px solid #f3c9d2;
            border-radius: 16px;
            padding: 18px 20px;
            text-align: left;
            margin-bottom: 24px;
        }
        .steps-title {
            font-size: 12px;
            font-weight: bold;
            color: #c75b7a;
            margin-bottom: 10px;
        }
        .step {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            font-size: 13px;
            color: #6b5060;
            padding: 5px 0;
        }
        .step-num {
            background: #c75b7a;
            color: white;
            font-size: 11px;
            font-weight: bold;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ffe6ee, #ffd6e8);
            color: #c75b7a;
            font-family: "Kosugi Maru", sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            border: 1px solid #f3c9d2;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">💌</div>
    <h1>お支払いが完了しました！</h1>
    <p class="lead">
        プレミアムプランへのご登録ありがとうございます。<br>
        まもなく専用リンクをメールでお送りします。
    </p>

    <div class="steps">
        <div class="steps-title">次のステップ</div>
        <div class="step">
            <div class="step-num">1</div>
            <div>登録したメールアドレスを確認してください（数分以内に届きます）</div>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <div>メール内の「プレミアムリンク」をタップ</div>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <div>そのリンクをブックマークして毎回ご利用ください</div>
        </div>
    </div>

    <a href="/lab" class="btn">診断ページへ戻る</a>
</div>
</body>
</html>
